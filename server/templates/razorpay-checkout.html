<!doctype html>
<html>
  <head>
    <title>MedSwift Payment</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0A1628;
        color: #E8ECF1;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container {
        text-align: center;
        max-width: 400px;
        width: 100%;
      }
      .logo { font-size: 32px; margin-bottom: 8px; }
      .title { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
      .subtitle { font-size: 14px; color: #8E99A4; margin-bottom: 24px; }
      .amount-card {
        background: #162844;
        border: 1px solid #1E3555;
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 24px;
      }
      .amount-label { font-size: 13px; color: #8E99A4; margin-bottom: 4px; }
      .amount-value { font-size: 36px; font-weight: 700; color: #00BFA6; }
      .spinner {
        border: 3px solid #1E3555;
        border-top-color: #00BFA6;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 0.8s linear infinite;
        margin: 20px auto;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .status-text { font-size: 15px; color: #8E99A4; }
      .error-text { font-size: 15px; color: #FF6B6B; margin-bottom: 16px; }
      .success-icon { font-size: 64px; margin-bottom: 12px; }
      .success-text { font-size: 18px; font-weight: 600; color: #00BFA6; margin-bottom: 8px; }
      .btn {
        display: inline-block;
        padding: 14px 28px;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        text-decoration: none;
        margin-top: 12px;
      }
      .btn-primary { background: #00BFA6; color: #fff; }
      .btn-secondary { background: #162844; color: #8E99A4; border: 1px solid #1E3555; }
      .btn:hover { opacity: 0.9; }
      .secure-badge {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 20px;
        font-size: 12px;
        color: #8E99A4;
      }
      #loading-state { display: block; }
      #success-state { display: none; }
      #error-state { display: none; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">💊</div>
      <div class="title">MedSwift Payment</div>
      <div class="subtitle">Powered by Razorpay</div>

      <div class="amount-card">
        <div class="amount-label">Total Amount</div>
        <div class="amount-value">AMOUNT_PLACEHOLDER</div>
      </div>

      <div id="loading-state">
        <div class="spinner"></div>
        <div class="status-text">Opening payment gateway...</div>
      </div>

      <div id="success-state">
        <div class="success-icon">&#10004;&#65039;</div>
        <div class="success-text">Payment Successful!</div>
        <div class="status-text">Redirecting back to app...</div>
      </div>

      <div id="error-state">
        <div class="error-text" id="error-message">Payment failed. Please try again.</div>
        <button class="btn btn-primary" onclick="openCheckout()">Retry Payment</button>
        <br />
        <a class="btn btn-secondary" href="CALLBACK_URL_PLACEHOLDER?status=cancelled">Return to App</a>
      </div>

      <div class="secure-badge">
        &#128274; Secured by Razorpay &middot; 256-bit SSL encryption
      </div>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
      var paymentConfig = {
        razorpayKeyId: "RAZORPAY_KEY_PLACEHOLDER",
        orderId: "ORDER_ID_PLACEHOLDER",
        amount: AMOUNT_RAW_PLACEHOLDER,
        currency: "CURRENCY_PLACEHOLDER",
        customerName: "CUSTOMER_NAME_PLACEHOLDER",
        customerEmail: "CUSTOMER_EMAIL_PLACEHOLDER",
        customerPhone: "CUSTOMER_PHONE_PLACEHOLDER",
        callbackUrl: "CALLBACK_URL_PLACEHOLDER",
        appScheme: "APP_SCHEME_PLACEHOLDER"
      };

      function showState(state) {
        document.getElementById("loading-state").style.display = "none";
        document.getElementById("success-state").style.display = "none";
        document.getElementById("error-state").style.display = "none";
        document.getElementById(state + "-state").style.display = "block";
      }

      function openCheckout() {
        showState("loading");
        var options = {
          key: paymentConfig.razorpayKeyId,
          amount: paymentConfig.amount,
          currency: paymentConfig.currency,
          name: "MedSwift",
          description: "Medicine Order Payment",
          order_id: paymentConfig.orderId,
          prefill: {
            name: paymentConfig.customerName,
            email: paymentConfig.customerEmail,
            contact: paymentConfig.customerPhone
          },
          theme: {
            color: "#00BFA6"
          },
          handler: function (response) {
            showState("success");
            // Redirect to callback with payment details
            var params = new URLSearchParams({
              status: "success",
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature
            });
            window.location.href = paymentConfig.callbackUrl + "?" + params.toString();
          },
          modal: {
            ondismiss: function () {
              showState("error");
              document.getElementById("error-message").textContent = "Payment was cancelled.";
            }
          }
        };
        var rzp = new Razorpay(options);
        rzp.on("payment.failed", function (response) {
          showState("error");
          document.getElementById("error-message").textContent =
            response.error.description || "Payment failed. Please try again.";
        });
        rzp.open();
      }

      // Auto-open checkout on page load
      openCheckout();
    </script>
  </body>
</html>
